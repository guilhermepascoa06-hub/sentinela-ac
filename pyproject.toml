[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sentinela-ac"
version = "0.1.0"
description = "Monitor auditável de concursos públicos para Rio Branco/AC"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.43,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2.9,<4",
  "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3", "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.13,<5", "pymupdf>=1.26.4,<2", "pypdf>=6,<7",
  "pyyaml>=6.0.2,<7", "typer>=0.16,<1", "tzdata>=2025.2", "cryptography>=45",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "respx>=0.22,<1", "ruff>=0.12", "mypy>=1.17", "types-PyYAML", "types-beautifulsoup4", "pip-audit>=2.9", "bandit>=1.8"]
browser = ["playwright>=1.55,<2"]

[project.scripts]
sentinela = "sentinela.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable PostgreSQL TEST_DATABASE_URL", "live: public network integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/sentinela"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
