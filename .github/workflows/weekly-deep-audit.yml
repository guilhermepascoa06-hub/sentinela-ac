name: Auditoria semanal

on:
  schedule:
    # Domingo 06:43 em America/Rio_Branco = 11:43 UTC, antes da coleta diária.
    - cron: '43 11 * * 0'
  workflow_dispatch:

concurrency:
  group: sentinela-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: OCR para editais escaneados
        # Retificacoes do CNU chegam como imagem: uma pagina, zero texto. Sem Tesseract
        # elas ficam ilegiveis para sempre na fila de revisao.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por
      - run: alembic upgrade head
      - name: Auditoria profunda
        run: sentinela deep-audit
      - name: Diagnóstico
        if: always()
        run: sentinela doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-${{ github.run_id }}
          path: reports/latest.md
          retention-days: 60
          if-no-files-found: warn
