name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinela
          POSTGRES_PASSWORD: sentinela
          POSTGRES_DB: sentinela_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinela"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Integration tests run against the same engine production uses.
      TEST_DATABASE_URL: postgresql+psycopg://sentinela:sentinela@localhost:5432/sentinela_test
      DATABASE_URL: postgresql+psycopg://sentinela:sentinela@localhost:5432/sentinela_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Formatação
        run: ruff format --check src tests
      - name: Tipos
        run: mypy
      - name: Registry de fontes é válido
        run: python -c "from sentinela.registry import load_registry; print(len(load_registry()), 'fontes')"
      - name: Migrations aplicam do zero
        run: alembic upgrade head
      - name: Migrations revertem
        run: alembic downgrade base
      - name: Migrations refletem os modelos
        run: |
          alembic upgrade head
          alembic check
      - name: Testes
        run: pytest -q --cov=sentinela --cov-report=term-missing --cov-fail-under=70
      - name: Segurança do código
        run: bandit -q -c pyproject.toml -r src
      - name: Vulnerabilidades conhecidas
        run: pip-audit --strict --ignore-vuln GHSA-4xh5-x5gv-qwph || pip-audit
        continue-on-error: true
      - name: Nenhum segredo commitado
        run: |
          # Procura pelo formato do segredo em si, não pelo nome da variável: a
          # documentação cita DATABASE_URL e TELEGRAM_BOT_TOKEN legitimamente.
          # A documentação mostra o formato da URL e este workflow usa um banco
          # descartável, então ambos ficam de fora; código e configuração, não.
          if git grep -nE 'postgres(ql)?(\+[a-z]+)?://[^:@[:space:]]+:[^@[:space:]]+@'                -- ':!*.example' ':!*.md' ':!.github/*'; then
            echo "::error::string de conexão com senha encontrada no repositório"; exit 1
          fi
          if git grep -nE '\b[0-9]{8,12}:[A-Za-z0-9_-]{30,}\b' -- ':!*.lock'; then
            echo "::error::token do Telegram encontrado no repositório"; exit 1
          fi
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env foi commitado"; exit 1
          fi
