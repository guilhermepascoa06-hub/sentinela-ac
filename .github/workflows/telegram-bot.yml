name: Responder no Telegram

on:
  schedule:
    # A cada 10 minutos, e cada turno fica escutando 9 -- entao na pratica o bot esta
    # sempre ouvindo e responde em segundos, nao de hora em hora.
    #
    # A cadencia antiga era de 1 em 1 hora por causa de dinheiro: o GitHub cobra minuto
    # arredondado para cima e o limite do plano gratuito era 2.000/mes. Esse motivo
    # morreu quando o repositorio virou publico -- repo publico nao tem teto de minutos.
    #
    # Se um turno atrasar ou morrer, nada se perde: o Telegram guarda por 24h tudo que
    # nao foi confirmado, e o turno seguinte responde. O grupo de concorrencia garante
    # um unico ouvinte por vez (dois getUpdates simultaneos recebem 409 da API).
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: sentinela-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar
        # Sem Playwright e sem OCR: responder perguntas nao coleta nada.
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install sqlalchemy psycopg[binary] pydantic pydantic-settings httpx pyyaml typer rich tzdata alembic
      - name: Escutar e responder
        run: sentinela bot --watch --minutes 9
