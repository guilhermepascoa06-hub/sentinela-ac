name: Responder no Telegram

# O bot fica escutando. Cada turno faz long polling por quase 6 horas -- o teto de um job
# no GitHub -- e termina sozinho; o grupo de concorrencia garante um unico ouvinte, porque
# dois getUpdates ao mesmo tempo recebem 409 da API do Telegram.
#
# Sao tres gatilhos de proposito, e o motivo e medido, nao teorico: o agendador do GitHub
# nunca disparou este workflow desde que ele foi criado, enquanto disparou o monitor e o
# backup normalmente. Entao o cron nao pode ser a unica forma de o bot voltar a ouvir.
#
#   schedule      -- a cada 30 min. Quando funciona, um turno morto e substituido rapido.
#   workflow_run  -- quando o monitor, o backup ou a auditoria terminam. Esses tres ja
#                    disparam de verdade, e cada um deles rende quase 6 horas de escuta.
#   dispatch      -- para religar na hora, sem esperar nada.
#
# Uma execucao que chega com o grupo ocupado fica pendente e assume assim que o turno atual
# acaba, entao a troca de turno nao abre buraco. E o que perde a vez nao perde mensagem: o
# Telegram guarda por 24h tudo que nao foi confirmado.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows:
      - Monitoramento diário
      - Backup do banco
      - Auditoria semanal
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sentinela-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  responder:
    runs-on: ubuntu-latest
    # O teto de um job e 6h. O turno para em 340 min para terminar por decisao propria,
    # nunca por execucao morta no meio de uma resposta.
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar
        # Sem Playwright e sem OCR: responder perguntas nao coleta nada.
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install sqlalchemy psycopg[binary] pydantic pydantic-settings httpx pyyaml typer rich tzdata alembic
      - name: Escutar e responder
        run: sentinela bot --watch --minutes 340
